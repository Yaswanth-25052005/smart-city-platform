
x-app-environment: &app-environment
  MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/
  DATABASE_NAME: ${MONGO_DATABASE:-smart_city}
  MONGO_DATABASE: ${MONGO_DATABASE:-smart_city}
  KAFKA_BOOTSTRAP: kafka:29092
  TOPIC_NAME: ${KAFKA_SENSOR_TOPIC:-smartcity.sensor_data}
  KAFKA_SENSOR_TOPIC: ${KAFKA_SENSOR_TOPIC:-smartcity.sensor_data}
  KAFKA_ALERT_TOPIC: ${KAFKA_ALERT_TOPIC:-smartcity.alerts}
  KAFKA_ANALYTICS_TOPIC: ${KAFKA_ANALYTICS_TOPIC:-smartcity.analytics}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ML_ENABLED: ${ML_ENABLED:-false}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode:"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: ["python", "scripts/create_topics.py"]
    restart: "no"

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-password}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-password}

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      SPARK_APP_NAME: ${SPARK_APP_NAME:-smart-city-analytics}
    healthcheck:
      test: ["CMD", "python", "scripts/spark_health_check.py"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: smart-city-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: smart-city-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  consumer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: smart-city-consumer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: ["python", "backend/ingestion/consumer_runner.py"]

  simulator:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: smart-city-simulator
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *app-environment
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-3}
    command: ["python", "-m", "backend.simulator.main"]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartcity-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-kafka-bridge:
    build:
      context: .
      dockerfile: docker/mqtt-bridge/Dockerfile
    container_name: smartcity-mqtt-kafka-bridge
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: smartcity/+/telemetry
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: ${KAFKA_SENSOR_TOPIC:-smartcity.sensor_data}
      MQTT_CLIENT_ID: smartcity-mqtt-kafka-bridge
      LOG_LEVEL: INFO

volumes:
  mongodb_data:
